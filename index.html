<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Arial', sans-serif; user-select: none; }
        #gameCanvas { display: block; margin: 0 auto; background: #1a1a2e; }
        
        /* UI HUD */
        #ui-layer { position: absolute; top: 10px; left: 10px; color: white; pointer-events: none; width: 100%; z-index: 5; }
        .hud-item { margin-right: 20px; font-size: 18px; font-weight: bold; text-shadow: 1px 1px 2px black; }
        
        /* Экраны (Старт, Гейм Овер) */
        #start-screen, #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85); display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            z-index: 10;
        }

        /* Квиз Модальное окно */
        #quiz-modal {
            display: none;
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 80%; max-width: 500px;
            background: #fff; border-radius: 10px; padding: 20px;
            box-shadow: 0 0 20px rgba(78, 204, 163, 0.8);
            z-index: 20; text-align: center; color: #333;
        }
        #quiz-question { font-size: 20px; margin-bottom: 20px; font-weight: bold; }
        .quiz-btn {
            display: block; width: 100%; margin: 10px 0; padding: 12px;
            background: #4ecca3; color: white; border: none; border-radius: 5px;
            font-size: 18px; cursor: pointer; transition: 0.2s;
        }
        .quiz-btn:hover { background: #3db892; }

        button.main-btn { padding: 10px 20px; font-size: 20px; cursor: pointer; background: #4ecca3; border: none; color: #000; border-radius: 5px; margin-top: 20px; }
    </style>
</head>
<body>

<div id="ui-layer" style="display:none;">
    <span class="hud-item">HP: <span id="hp-display">3</span></span>
    <span class="hud-item">Score: <span id="score-display">0</span></span>
    <span class="hud-item" id="boss-hud" style="display:none;">BOSS HP: <span id="boss-hp-display">10</span></span>
</div>

<div id="start-screen">
    <h1>Space Grammar Fighter</h1>
    <p>Стреляй в: <span id="target-rule" style="color: #4ecca3; font-weight: bold;"></span></p>
    <p>Босс задаст вопросы при попадании!</p>
    <button class="main-btn" onclick="startGame()">Start Mission</button>
</div>

<div id="game-over-screen" style="display:none;">
    <h1 id="go-title">Game Over</h1>
    <p id="go-message"></p>
    <button class="main-btn" onclick="location.reload()">Restart</button>
</div>

<div id="quiz-modal">
    <div id="quiz-question">Question text here...</div>
    <div id="quiz-options">
        </div>
</div>

<canvas id="gameCanvas" width="800" height="600"></canvas>

<script>
/* ==========================================
   КОНФИГУРАЦИЯ (Будет в редакторе)
   ========================================== */
const gameConfig = {
    // Настройки геймплея
    targetWords: ["Apple", "Car", "Book", "Dog", "Pen", "Cup", "Chair"], 
    distractorWords: ["Water", "Milk", "Rice", "Air", "Music", "Money", "Sand"], 
    targetRuleText: "Countable Nouns", 
    
    shipsToWin: 5, // Уменьшил для быстрого теста босса (поставь больше, если нужно)
    playerHP: 3,
    
    // БОСС КВИЗ (10 вопросов)
    // correctIndex: номер правильного ответа в массиве options (начинается с 0)
    bossQuestions: [
        { 
            text: "1) I have three waters in my bag.", 
            options: ["Correct", "Incorrect"], 
            correctIndex: 1 
        },
        { 
            text: "2) There are five apples on the table.", 
            options: ["Correct", "Incorrect"], 
            correctIndex: 0 
        },
        { 
            text: "3) Choose: 'I have ___ milk at home.'", 
            options: ["a milk", "some milk"], 
            correctIndex: 1 
        },
        { 
            text: "4) Choose: 'I buy ___ at the bakery.'", 
            options: ["some bread", "a bread"], 
            correctIndex: 0 
        },
        { 
            text: "5) 'Information' is a countable noun.", 
            options: ["True", "False"], 
            correctIndex: 1 
        },
        { 
            text: "6) Which word is uncountable?", 
            options: ["Banana", "Sugar"], 
            correctIndex: 1 
        },
        { 
            text: "7) How ___ money do you have?", 
            options: ["many", "much"], 
            correctIndex: 1 
        },
        { 
            text: "8) I need ___ advice.", 
            options: ["some", "an"], 
            correctIndex: 0 
        },
        { 
            text: "9) The furniture ___ expensive.", 
            options: ["is", "are"], 
            correctIndex: 0 
        },
        { 
            text: "10) Look at all that ___!", 
            options: ["snow", "snows"], 
            correctIndex: 0 
        }
    ],

    fontFamily: "Arial",
    wordColor: "#FFFFFF",
    wordSize: "16px",
    
    msgRight: "Right!",
    msgWrong: "Wrong!",
    msgWin: "Mission Complete! Knowledge Acquired!",
    msgLose: "Mission Failed!",
    
    enemySpeed: 2,
    asteroidSpeed: 3
};

// Босс HP равен количеству вопросов
gameConfig.bossHP = gameConfig.bossQuestions.length;

document.getElementById('target-rule').innerText = gameConfig.targetRuleText;

/* ==========================================
   ДВИЖОК ИГРЫ
   ========================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');

let state = {
    isPlaying: false,
    isQuizActive: false, // Флаг для паузы во время квиза
    score: 0,
    hp: gameConfig.playerHP,
    enemiesKilled: 0,
    bossActive: false,
    bossCurrentHP: gameConfig.bossHP,
    currentQuestionIndex: 0, // Какой вопрос сейчас задаем
    lastShotTime: 0
};

// Объекты
const player = { x: 375, y: 520, w: 50, h: 50, speed: 5, color: '#4ecca3', isHit: false };
let bullets = [];
let enemies = [];
let asteroids = [];
let particles = [];
let floatingTexts = [];
let boss = { x: 350, y: -100, w: 100, h: 100, dir: 1, enterSpeed: 2 };

// Управление
const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

window.addEventListener('keydown', (e) => {
    if(state.isQuizActive) return; // Блокируем управление во время квиза
    if(e.code === 'Space') keys.Space = true;
    if(e.code === 'ArrowLeft') keys.ArrowLeft = true;
    if(e.code === 'ArrowRight') keys.ArrowRight = true;
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'Space') keys.Space = false;
    if(e.code === 'ArrowLeft') keys.ArrowLeft = false;
    if(e.code === 'ArrowRight') keys.ArrowRight = false;
});

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    uiLayer.style.display = 'block';
    state.isPlaying = true;
    
    // Обновляем HP дисплеи
    document.getElementById('hp-display').innerText = state.hp;
    document.getElementById('boss-hp-display').innerText = state.bossCurrentHP;

    gameLoop();
    
    setInterval(spawnEnemy, 2000);
    setInterval(spawnAsteroid, 1500);
}

// --- Логика спавна ---
function spawnEnemy() {
    if (!state.isPlaying || state.bossActive || state.isQuizActive) return;
    
    const isTarget = Math.random() > 0.5;
    let word = isTarget ? 
        gameConfig.targetWords[Math.floor(Math.random() * gameConfig.targetWords.length)] : 
        gameConfig.distractorWords[Math.floor(Math.random() * gameConfig.distractorWords.length)];

    enemies.push({
        x: Math.random() * (canvas.width - 60),
        y: -50,
        w: 60,
        h: 40,
        text: word,
        isTarget: isTarget,
        speed: gameConfig.enemySpeed
    });
}

function spawnAsteroid() {
    if (!state.isPlaying || state.bossActive || state.isQuizActive) return;
    asteroids.push({
        x: Math.random() * (canvas.width - 40),
        y: -40,
        r: 20,
        speed: gameConfig.asteroidSpeed
    });
}

function spawnFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 60, dy: -1 });
}

function createExplosion(x, y, color) {
    for(let i=0; i<10; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 5,
            vy: (Math.random() - 0.5) * 5,
            life: 30,
            color: color
        });
    }
}

// --- Обновление физики ---
function update() {
    // Если игра не идет или открыт квиз - стоп
    if (!state.isPlaying || state.isQuizActive) return;

    // Игрок
    if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
    if (keys.ArrowRight && player.x < canvas.width - player.w) player.x += player.speed;

    // Стрельба
    if (keys.Space && Date.now() - state.lastShotTime > 400) {
        bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 10, speed: 7 });
        state.lastShotTime = Date.now();
    }

    // Пули
    bullets.forEach((b, i) => {
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(i, 1);
    });

    // Враги (Слова)
    enemies.forEach((e, i) => {
        e.y += e.speed;
        
        bullets.forEach((b, bi) => {
            if (rectIntersect(b, e)) {
                bullets.splice(bi, 1);
                enemies.splice(i, 1);
                createExplosion(e.x + e.w/2, e.y + e.h/2, '#ffa500');
                
                if (e.isTarget) {
                    state.score += 10;
                    state.enemiesKilled++;
                    spawnFloatingText(gameConfig.msgRight, e.x, e.y, '#00ff00');
                    checkBossSpawn();
                } else {
                    takeDamage();
                    spawnFloatingText(gameConfig.msgWrong, e.x, e.y, '#ff0000');
                }
            }
        });
        if (e.y > canvas.height) enemies.splice(i, 1);
    });

    // Астероиды
    asteroids.forEach((a, i) => {
        a.y += a.speed;
        if (circleRectIntersect(a, player)) {
            asteroids.splice(i, 1);
            takeDamage();
            createExplosion(player.x, player.y, '#ffffff');
        }
        if (a.y > canvas.height) asteroids.splice(i, 1);
    });

    // БОСС
    if (state.bossActive) {
        if (boss.y < 50) boss.y += boss.enterSpeed;
        else {
            boss.x += 2 * boss.dir;
            if (boss.x > canvas.width - boss.w || boss.x < 0) boss.dir *= -1;
        }

        bullets.forEach((b, bi) => {
            if (rectIntersect(b, boss)) {
                bullets.splice(bi, 1);
                // ЗАПУСК КВИЗА
                triggerBossQuiz(b.x, b.y);
            }
        });
    }

    // Частицы
    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life<=0) particles.splice(i,1); });
    floatingTexts.forEach((t, i) => { t.y += t.dy; t.life--; if(t.life<=0) floatingTexts.splice(i,1); });
    
    document.getElementById('score-display').innerText = state.score;
}

// --- ЛОГИКА КВИЗА ---
function triggerBossQuiz(hitX, hitY) {
    createExplosion(hitX, hitY, '#ff00ff');
    state.isQuizActive = true; // Пауза
    
    // Берем вопрос
    // Если вопросы кончились, берем последний, или рандомный
    let qIdx = state.currentQuestionIndex;
    if (qIdx >= gameConfig.bossQuestions.length) {
        qIdx = Math.floor(Math.random() * gameConfig.bossQuestions.length);
    }
    
    const questionData = gameConfig.bossQuestions[qIdx];
    
    // Рендерим модальное окно
    const modal = document.getElementById('quiz-modal');
    const qText = document.getElementById('quiz-question');
    const qOptions = document.getElementById('quiz-options');
    
    qText.innerText = questionData.text;
    qOptions.innerHTML = ''; // Очистка старых кнопок
    
    questionData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = opt;
        btn.onclick = () => handleQuizAnswer(index, questionData.correctIndex);
        qOptions.appendChild(btn);
    });
    
    modal.style.display = 'block';
}

function handleQuizAnswer(selectedIndex, correctIndex) {
    const modal = document.getElementById('quiz-modal');
    modal.style.display = 'none';
    
    // Небольшая задержка перед снятием паузы, чтобы случайно не выстрелить
    setTimeout(() => {
        state.isQuizActive = false;
    }, 100);

    if (selectedIndex === correctIndex) {
        // ПРАВИЛЬНО
        state.bossCurrentHP--;
        state.currentQuestionIndex++; // Следующий вопрос
        document.getElementById('boss-hp-display').innerText = state.bossCurrentHP;
        spawnFloatingText("Correct!", boss.x, boss.y + 50, '#00ff00');
        
        if (state.bossCurrentHP <= 0) {
            gameWin();
        }
    } else {
        // НЕПРАВИЛЬНО
        takeDamage(); // Игрок получает урон
        spawnFloatingText("Wrong Answer!", boss.x, boss.y + 50, '#ff0000');
        // Босс НЕ теряет HP, вопрос задастся снова (или следующий, зависит от логики, тут оставим тот же вопрос при следующем выстреле)
        // Если хотим тот же вопрос: state.currentQuestionIndex не меняем
        // Если хотим пропустить вопрос: state.currentQuestionIndex++ (но тогда босс может не умереть)
        // Решение: оставляем index прежним, игроку нужно выстрелить и ответить снова.
    }
}

function checkBossSpawn() {
    if (state.enemiesKilled >= gameConfig.shipsToWin && !state.bossActive) {
        state.bossActive = true;
        document.getElementById('boss-hud').style.display = 'inline';
        enemies = [];
        asteroids = [];
    }
}

function takeDamage() {
    state.hp--;
    document.getElementById('hp-display').innerText = state.hp;
    player.isHit = true;
    setTimeout(() => player.isHit = false, 200);

    if (state.hp <= 0) {
        gameOver();
    }
}

function gameWin() {
    state.isPlaying = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('go-title').innerText = "VICTORY";
    document.getElementById('go-message').innerText = gameConfig.msgWin;
}

function gameOver() {
    state.isPlaying = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('go-title').innerText = "GAME OVER";
    document.getElementById('go-message').innerText = gameConfig.msgLose;
}

// --- Отрисовка ---
function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ffffff';
    for(let i=0; i<10; i++) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

    // Игрок
    ctx.fillStyle = player.isHit ? '#ff0000' : player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w/2, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.fill();

    // Враги
    enemies.forEach(e => {
        ctx.fillStyle = '#e94560'; 
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = gameConfig.wordColor;
        ctx.font = gameConfig.wordSize + ' ' + gameConfig.fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(e.text, e.x + e.w/2, e.y + e.h/2 + 5);
    });

    // Астероиды
    ctx.fillStyle = '#533e85';
    asteroids.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
        ctx.fill();
    });

    // Босс
    if (state.bossActive) {
        ctx.fillStyle = '#8a2be2';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        ctx.fillStyle = 'white';
        ctx.font = "bold 20px Arial";
        ctx.textAlign = 'center';
        ctx.fillText("BOSS", boss.x + boss.w/2, boss.y + boss.h/2 + 8);
    }

    // Пули
    ctx.fillStyle = '#fdb44b';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // Частицы
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 3, 3);
    });

    // Текст
    floatingTexts.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.font = "bold 20px Arial";
        ctx.fillText(t.text, t.x, t.y);
    });
}

function gameLoop() {
    // requestAnimationFrame вызывается всегда, но update стопится флагом
    update();
    draw();
    if (state.isPlaying || state.isQuizActive) {
        requestAnimationFrame(gameLoop);
    }
}

// Утилиты
function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}
function circleRectIntersect(circle, rect) {
    let distX = Math.abs(circle.x - rect.x - rect.w/2);
    let distY = Math.abs(circle.y - rect.y - rect.h/2);
    if (distX > (rect.w/2 + circle.r)) return false; 
    if (distY > (rect.h/2 + circle.r)) return false;
    if (distX <= (rect.w/2)) return true; 
    if (distY <= (rect.h/2)) return true;
    let dx = distX - rect.w/2;
    let dy = distY - rect.h/2;
    return (dx*dx + dy*dy <= (circle.r*circle.r));
}
</script>
</body>
</html>
