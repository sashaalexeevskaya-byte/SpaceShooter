<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Space Grammar Fighter</title>
    <style>
        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000; 
            font-family: 'Arial', sans-serif; 
            user-select: none; 
        }
        #game-container {
            position: relative;
            width: 800px;
            height: 600px;
            margin: 0 auto;
            background: #1a1a2e;
        }
        canvas { 
            display: block; 
            width: 100%; 
            height: 100%; 
        }
        
        /* UI HUD */
        #ui-layer { 
            position: absolute; 
            top: 10px; 
            left: 10px; 
            color: white; 
            pointer-events: none; 
            width: 100%; 
            z-index: 5; 
        }
        .hud-item { 
            margin-right: 20px; 
            font-size: 18px; 
            font-weight: bold; 
            text-shadow: 1px 1px 2px black; 
        }
        
        /* Экраны (Старт, Гейм Овер) */
        #start-screen, #game-over-screen {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9); 
            display: flex; flex-direction: column;
            justify-content: center; align-items: center; color: white;
            z-index: 100;
        }

        /* Квиз Модальное окно */
        #quiz-modal {
            display: none; /* Скрыто по умолчанию */
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            width: 80%; max-width: 500px;
            background: #fff; 
            border: 4px solid #4ecca3;
            border-radius: 10px; 
            padding: 25px;
            box-shadow: 0 0 50px rgba(0,0,0,0.8);
            z-index: 200; /* Самый высокий слой */
            text-align: center; 
            color: #333;
        }
        #quiz-question { 
            font-size: 22px; 
            margin-bottom: 25px; 
            font-weight: bold; 
            color: #1a1a2e;
        }
        .quiz-btn {
            display: block; width: 100%; margin: 10px 0; padding: 15px;
            background: #4ecca3; color: #000; border: none; border-radius: 5px;
            font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .quiz-btn:hover { background: #3db892; transform: scale(1.02); }

        button.main-btn { 
            padding: 15px 30px; font-size: 20px; cursor: pointer; 
            background: #4ecca3; border: none; color: #000; 
            border-radius: 5px; margin-top: 20px; font-weight: bold; 
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="ui-layer" style="display:none;">
        <span class="hud-item">HP: <span id="hp-display">3</span></span>
        <span class="hud-item">Score: <span id="score-display">0</span></span>
        <span class="hud-item" id="boss-hud" style="display:none;">BOSS HP: <span id="boss-hp-display">10</span></span>
    </div>

    <div id="start-screen">
        <h1>Space Grammar Fighter</h1>
        <p style="font-size: 18px; margin-bottom: 5px;">Mission: Shoot <span id="target-rule" style="color: #4ecca3; font-weight: bold;"></span></p>
        <p style="font-size: 14px; color: #aaa;">Arrow Keys to Move | Space to Shoot</p>
        <button class="main-btn" onclick="startGame()">Start Game</button>
    </div>

    <div id="game-over-screen" style="display:none;">
        <h1 id="go-title">Game Over</h1>
        <p id="go-message" style="font-size: 20px;"></p>
        <button class="main-btn" onclick="location.reload()">Play Again</button>
    </div>

    <div id="quiz-modal">
        <div id="quiz-question">Question placeholder</div>
        <div id="quiz-options"></div>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>
</div>

<script>
/* ==========================================
   КОНФИГУРАЦИЯ
   ========================================== */
const gameConfig = {
    // Настройки геймплея
    targetWords: ["Apple", "Car", "Book", "Dog", "Pen", "Cup", "Chair", "Phone", "Star", "Tree"], 
    distractorWords: ["Water", "Milk", "Rice", "Air", "Music", "Money", "Sand", "Love", "Salt", "Time"], 
    targetRuleText: "Countable Nouns", 
    
    shipsToWin: 10, // Сколько кораблей сбить до босса
    playerHP: 3,
    bossHP: 10, // Равно количеству вопросов
    
    // БОСС КВИЗ (10 вопросов)
    bossQuestions: [
        { text: "1) I have three ___ in my bag.", options: ["waters", "water"], correctIndex: 1 }, // Trick question fix: water is uncountable usually, but context "bottles". Let's use standard rule: Uncountable -> water. Wait, the option was "waters". Incorrect. Correct is "water".
        // Let's stick to your requested questions explicitly:
        { text: "1) I have three waters in my bag.", options: ["Correct", "Incorrect"], correctIndex: 1 },
        { text: "2) There are five apples on the table.", options: ["Correct", "Incorrect"], correctIndex: 0 },
        { text: "3) Choose: 'I have ___ milk at home.'", options: ["a milk", "some milk"], correctIndex: 1 },
        { text: "4) Choose: 'I buy ___ at the bakery.'", options: ["some bread", "a bread"], correctIndex: 0 },
        { text: "5) 'Information' is a countable noun.", options: ["True", "False"], correctIndex: 1 },
        { text: "6) Which word is uncountable?", options: ["Banana", "Sugar"], correctIndex: 1 },
        { text: "7) How ___ money do you have?", options: ["many", "much"], correctIndex: 1 },
        { text: "8) I need ___ advice.", options: ["some", "an"], correctIndex: 0 },
        { text: "9) The furniture ___ expensive.", options: ["is", "are"], correctIndex: 0 },
        { text: "10) Look at all that ___!", options: ["snow", "snows"], correctIndex: 0 }
    ],

    fontFamily: "Arial",
    wordColor: "#FFFFFF",
    wordSize: "18px",
    
    msgRight: "Right!",
    msgWrong: "Wrong!",
    msgWin: "Mission Complete! You are a Grammar Master!",
    msgLose: "Mission Failed! Try again.",
    
    enemySpeed: 2,
    asteroidSpeed: 3
};

document.getElementById('target-rule').innerText = gameConfig.targetRuleText;

/* ==========================================
   ДВИЖОК ИГРЫ
   ========================================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const uiLayer = document.getElementById('ui-layer');

let state = {
    isPlaying: false,
    isQuizActive: false, 
    score: 0,
    hp: gameConfig.playerHP,
    enemiesKilled: 0,
    bossActive: false,
    bossCurrentHP: gameConfig.bossHP,
    currentQuestionIndex: 0, 
    lastShotTime: 0
};

// Объекты
const player = { x: 375, y: 520, w: 50, h: 50, speed: 6, color: '#4ecca3', isHit: false };
let bullets = [];
let enemies = [];
let asteroids = [];
let particles = [];
let floatingTexts = [];
let boss = { x: 350, y: -120, w: 120, h: 100, dir: 1, enterSpeed: 3 };

// Управление
const keys = { ArrowLeft: false, ArrowRight: false, Space: false };

window.addEventListener('keydown', (e) => {
    if(state.isQuizActive) return; // Блокировка при квизе
    if(e.code === 'Space') keys.Space = true;
    if(e.code === 'ArrowLeft') keys.ArrowLeft = true;
    if(e.code === 'ArrowRight') keys.ArrowRight = true;
});
window.addEventListener('keyup', (e) => {
    if(e.code === 'Space') keys.Space = false;
    if(e.code === 'ArrowLeft') keys.ArrowLeft = false;
    if(e.code === 'ArrowRight') keys.ArrowRight = false;
});

function startGame() {
    document.getElementById('start-screen').style.display = 'none';
    uiLayer.style.display = 'block';
    
    // Сброс состояния
    state.hp = gameConfig.playerHP;
    state.score = 0;
    state.enemiesKilled = 0;
    state.bossActive = false;
    state.bossCurrentHP = gameConfig.bossHP;
    state.currentQuestionIndex = 0;
    state.isPlaying = true;
    state.isQuizActive = false;
    
    bullets = [];
    enemies = [];
    asteroids = [];
    particles = [];
    floatingTexts = [];
    player.x = 375;
    boss.y = -120;

    document.getElementById('hp-display').innerText = state.hp;
    document.getElementById('score-display').innerText = state.score;
    document.getElementById('boss-hud').style.display = 'none';

    gameLoop();
    
    // Интервалы спавна
    setInterval(() => { if(!state.bossActive && !state.isQuizActive) spawnEnemy(); }, 2000);
    setInterval(() => { if(!state.bossActive && !state.isQuizActive) spawnAsteroid(); }, 1500);
}

// --- Логика спавна ---
function spawnEnemy() {
    if (!state.isPlaying) return;
    const isTarget = Math.random() > 0.5;
    let word = isTarget ? 
        gameConfig.targetWords[Math.floor(Math.random() * gameConfig.targetWords.length)] : 
        gameConfig.distractorWords[Math.floor(Math.random() * gameConfig.distractorWords.length)];

    enemies.push({
        x: Math.random() * (canvas.width - 80),
        y: -50, w: 80, h: 40,
        text: word, isTarget: isTarget, speed: gameConfig.enemySpeed
    });
}

function spawnAsteroid() {
    if (!state.isPlaying) return;
    asteroids.push({
        x: Math.random() * (canvas.width - 40),
        y: -40, r: 25, speed: gameConfig.asteroidSpeed
    });
}

// --- Обновление физики ---
function update() {
    // ГЛАВНАЯ ПРОВЕРКА: Если квиз активен, не обновляем физику
    if (!state.isPlaying || state.isQuizActive) return;

    // Игрок
    if (keys.ArrowLeft && player.x > 0) player.x -= player.speed;
    if (keys.ArrowRight && player.x < canvas.width - player.w) player.x += player.speed;

    // Стрельба
    if (keys.Space && Date.now() - state.lastShotTime > 400) {
        bullets.push({ x: player.x + player.w/2 - 2, y: player.y, w: 4, h: 12, speed: 8 });
        state.lastShotTime = Date.now();
    }

    // Движение пуль (обратный цикл для безопасного удаления)
    for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.y -= b.speed;
        if (b.y < 0) bullets.splice(i, 1);
    }

    // Движение врагов
    for (let i = enemies.length - 1; i >= 0; i--) {
        let e = enemies[i];
        e.y += e.speed;

        // Коллизия с пулями
        for (let j = bullets.length - 1; j >= 0; j--) {
            let b = bullets[j];
            if (rectIntersect(b, e)) {
                bullets.splice(j, 1); // Удалить пулю
                enemies.splice(i, 1); // Удалить врага
                
                if (e.isTarget) {
                    state.score += 10;
                    state.enemiesKilled++;
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#00ff00');
                    spawnFloatingText(gameConfig.msgRight, e.x, e.y, '#00ff00');
                    checkBossSpawn();
                } else {
                    takeDamage();
                    createExplosion(e.x + e.w/2, e.y + e.h/2, '#ff0000');
                    spawnFloatingText(gameConfig.msgWrong, e.x, e.y, '#ff0000');
                }
                break; // Выход из цикла пуль, так как враг уничтожен
            }
        }
        if (e.y > canvas.height) enemies.splice(i, 1);
    }

    // Астероиды
    for (let i = asteroids.length - 1; i >= 0; i--) {
        let a = asteroids[i];
        a.y += a.speed;
        if (circleRectIntersect(a, player)) {
            asteroids.splice(i, 1);
            takeDamage();
            createExplosion(player.x, player.y, '#ffffff');
        } else if (a.y > canvas.height) {
            asteroids.splice(i, 1);
        }
    }

    // БОСС
    if (state.bossActive) {
        // Выход босса
        if (boss.y < 50) boss.y += boss.enterSpeed;
        else {
            boss.x += 3 * boss.dir;
            if (boss.x > canvas.width - boss.w || boss.x < 0) boss.dir *= -1;
        }

        // Проверка попадания в босса
        for (let i = bullets.length - 1; i >= 0; i--) {
            let b = bullets[i];
            if (rectIntersect(b, boss)) {
                bullets.splice(i, 1); // Удаляем пулю
                triggerBossQuiz(b.x, b.y); // ЗАПУСКАЕМ КВИЗ
                return; // ПРЕРЫВАЕМ UPDATE СРАЗУ
            }
        }
    }

    // Эффекты
    particles.forEach((p, i) => { p.x += p.vx; p.y += p.vy; p.life--; if(p.life<=0) particles.splice(i,1); });
    floatingTexts.forEach((t, i) => { t.y += t.dy; t.life--; if(t.life<=0) floatingTexts.splice(i,1); });
    
    document.getElementById('score-display').innerText = state.score;
}

// --- ЛОГИКА КВИЗА ---
function triggerBossQuiz(hitX, hitY) {
    state.isQuizActive = true; // СТАВИМ ПАУЗУ
    
    createExplosion(hitX, hitY, '#ff00ff'); // Эффект удара
    
    // Получаем текущий вопрос
    let qIdx = state.currentQuestionIndex;
    // Если вопросы кончились (на всякий случай), берем последний
    if (qIdx >= gameConfig.bossQuestions.length) qIdx = gameConfig.bossQuestions.length - 1;
    
    const questionData = gameConfig.bossQuestions[qIdx];
    
    // Заполняем HTML
    const modal = document.getElementById('quiz-modal');
    const qText = document.getElementById('quiz-question');
    const qOptions = document.getElementById('quiz-options');
    
    qText.innerText = questionData.text;
    qOptions.innerHTML = ''; 
    
    questionData.options.forEach((opt, index) => {
        const btn = document.createElement('button');
        btn.className = 'quiz-btn';
        btn.innerText = opt;
        // preventDefault чтобы не сбивался фокус
        btn.onmousedown = (e) => e.preventDefault(); 
        btn.onclick = () => handleQuizAnswer(index, questionData.correctIndex);
        qOptions.appendChild(btn);
    });
    
    modal.style.display = 'block';
}

function handleQuizAnswer(selectedIndex, correctIndex) {
    const modal = document.getElementById('quiz-modal');
    modal.style.display = 'none';
    
    // Небольшая задержка перед снятием паузы
    setTimeout(() => {
        state.isQuizActive = false;
    }, 100);

    if (selectedIndex === correctIndex) {
        // ПРАВИЛЬНО
        state.bossCurrentHP--;
        state.currentQuestionIndex++; 
        document.getElementById('boss-hp-display').innerText = state.bossCurrentHP;
        spawnFloatingText("CORRECT!", boss.x + boss.w/2, boss.y + boss.h, '#00ff00');
        
        if (state.bossCurrentHP <= 0) {
            gameWin();
        }
    } else {
        // НЕПРАВИЛЬНО
        takeDamage();
        spawnFloatingText("WRONG!", boss.x + boss.w/2, boss.y + boss.h, '#ff0000');
        // Босс не теряет HP, вопрос задается тот же при следующем попадании
    }
}

function checkBossSpawn() {
    if (state.enemiesKilled >= gameConfig.shipsToWin && !state.bossActive) {
        state.bossActive = true;
        document.getElementById('boss-hud').style.display = 'inline';
        document.getElementById('boss-hp-display').innerText = state.bossCurrentHP;
        enemies = [];
        asteroids = [];
    }
}

function takeDamage() {
    state.hp--;
    document.getElementById('hp-display').innerText = state.hp;
    player.isHit = true;
    setTimeout(() => player.isHit = false, 200);

    if (state.hp <= 0) {
        gameOver();
    }
}

function gameWin() {
    state.isPlaying = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('go-title').innerText = "YOU WIN!";
    document.getElementById('go-message').innerText = gameConfig.msgWin;
}

function gameOver() {
    state.isPlaying = false;
    document.getElementById('game-over-screen').style.display = 'flex';
    document.getElementById('go-title').innerText = "GAME OVER";
    document.getElementById('go-message').innerText = gameConfig.msgLose;
}

// --- Утилиты ---
function spawnFloatingText(text, x, y, color) {
    floatingTexts.push({ text, x, y, color, life: 60, dy: -1 });
}
function createExplosion(x, y, color) {
    for(let i=0; i<15; i++) {
        particles.push({
            x: x, y: y,
            vx: (Math.random() - 0.5) * 8,
            vy: (Math.random() - 0.5) * 8,
            life: 40,
            color: color
        });
    }
}
function rectIntersect(r1, r2) {
    return !(r2.x > r1.x + r1.w || r2.x + r2.w < r1.x || r2.y > r1.y + r1.h || r2.y + r2.h < r1.y);
}
function circleRectIntersect(circle, rect) {
    let distX = Math.abs(circle.x - rect.x - rect.w/2);
    let distY = Math.abs(circle.y - rect.y - rect.h/2);
    if (distX > (rect.w/2 + circle.r)) return false; 
    if (distY > (rect.h/2 + circle.r)) return false;
    if (distX <= (rect.w/2)) return true; 
    if (distY <= (rect.h/2)) return true;
    let dx = distX - rect.w/2; let dy = distY - rect.h/2;
    return (dx*dx + dy*dy <= (circle.r*circle.r));
}

// --- Отрисовка (Работает даже на паузе) ---
function draw() {
    ctx.fillStyle = '#1a1a2e';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // Звезды
    ctx.fillStyle = '#ffffff';
    // Простая симуляция звезд (статичная для оптимизации)
    if(Math.random()>0.9) ctx.fillRect(Math.random()*canvas.width, Math.random()*canvas.height, 2, 2);

    // Игрок
    ctx.fillStyle = player.isHit ? '#ff0000' : player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.w/2, player.y);
    ctx.lineTo(player.x + player.w, player.y + player.h);
    ctx.lineTo(player.x, player.y + player.h);
    ctx.fill();

    // Враги
    enemies.forEach(e => {
        ctx.fillStyle = '#e94560'; 
        ctx.fillRect(e.x, e.y, e.w, e.h);
        ctx.fillStyle = gameConfig.wordColor;
        ctx.font = gameConfig.wordSize + ' ' + gameConfig.fontFamily;
        ctx.textAlign = 'center';
        ctx.fillText(e.text, e.x + e.w/2, e.y + e.h/2 + 5);
    });

    // Астероиды
    ctx.fillStyle = '#533e85';
    asteroids.forEach(a => {
        ctx.beginPath();
        ctx.arc(a.x, a.y, a.r, 0, Math.PI*2);
        ctx.fill();
    });

    // Босс
    if (state.bossActive) {
        ctx.fillStyle = '#8a2be2';
        ctx.fillRect(boss.x, boss.y, boss.w, boss.h);
        // Глаза босса
        ctx.fillStyle = 'white';
        ctx.fillRect(boss.x + 20, boss.y + 30, 20, 20);
        ctx.fillRect(boss.x + boss.w - 40, boss.y + 30, 20, 20);
        // Рот
        ctx.fillStyle = 'black';
        ctx.fillRect(boss.x + 30, boss.y + 70, boss.w - 60, 10);
        
        ctx.fillStyle = 'white';
        ctx.font = "bold 20px Arial";
        ctx.textAlign = 'center';
        ctx.fillText("BOSS", boss.x + boss.w/2, boss.y - 10);
    }

    // Пули
    ctx.fillStyle = '#fdb44b';
    bullets.forEach(b => ctx.fillRect(b.x, b.y, b.w, b.h));

    // Частицы
    particles.forEach(p => {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, 4, 4);
    });

    // Текст
    floatingTexts.forEach(t => {
        ctx.fillStyle = t.color;
        ctx.font = "bold 24px Arial";
        ctx.textAlign = 'center';
        ctx.fillText(t.text, t.x, t.y);
    });
}

function gameLoop() {
    update();
    draw();
    if (state.isPlaying || state.isQuizActive) {
        requestAnimationFrame(gameLoop);
    }
}
</script>
</body>
</html>
